min_version: 2.1.0

pre-commit:
  parallel: false
  commands:
    security-leakage:
      run: bun run security:public
    format:
      run: bun run format:check
    biome:
      run: bun run lint:biome
    eslint:
      run: bun run lint
    typecheck:
      run: bun run typecheck
    dead-code:
      run: bun run lint:dead
    test:
      run: bun run test

pre-push:
  parallel: false
  commands:
    security-leakage:
      run: bun run security:public
    quality:
      run: bun run quality
